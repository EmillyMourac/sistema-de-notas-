<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema escolar</title>

    
    <!-- <link rel="stylesheet" href="style.css"> -->
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>



<body>

    <h1 class="text-primary"> Sistema escolar</h1>

    <form id="formulario">
        <fieldset>
            <legend>Informações do aluno</legend>

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite o nome"
                required
            >

            <br><br>

            <label for="idade">Idade:</label>
            <input
                type="number"
                id="idade"
                name="idade"
                min="14"
                max="100"
                required
            >

            <br><br>

            <label for="nota1">nota1:</label>
            <input
                type="number"
                id="nota1"
                name="nota1"
                min="0"
                max="10"
                required
            >

            <br><br>

            <label for="nota2">nota2:</label>
            <input
                type="number"
                id="nota2"
                name="nota2"
                min="0"
                max="10"
                required
            >

            <br><br>

            <label for="nota3">nota3:</label>
            <input
                type="number"
                id="nota3"
                name="nota3"
                min="0"
                max="10"
                required
            >

            <br><br>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>


        </fieldset>
    </form>

    <fieldset>
        <form>

            <legend>Situação do Aluno</legend>

            <br><br>

                <label for="media">Media:</label>
            <p id="media"></p>

            <label for="situacaoAluno"></label>
            <p id="situacao">Situação: </p>
            <p id="ExibirN"></p>
            <p id="exibirIdade"></p>
            <p id="exibirN1"></p>
            <p id="exibirN2"></p>
            <p id="exibirN3"></p>

            </form>
    </fieldset>

</body>

</html>
